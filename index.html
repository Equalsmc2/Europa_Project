<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Europa ASCII Viewer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            overflow: hidden;
            font-family: monospace;
        }
        #info {
            position: absolute;
            top: 15px;
            left: 20px;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 12px;
            pointer-events: none;
            font-size: 12px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="info">EUROPA.GLB // ASCII RENDERER</div>

    <!-- Import maps polyfill & Three.js modules -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { AsciiEffect } from 'three/addons/effects/AsciiEffect.js';

        let camera, scene, renderer, effect, controls, model;

        init();
        animate();

        function init() {
            // Camera setup
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 5);

            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);

            // Lighting so colors come through clearly
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 2);
            pointLight.position.set(5, 5, 5);
            scene.add(pointLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(-5, -5, -5);
            scene.add(dirLight);

            // Renderer setup
            renderer = new THREE.WebGLRenderer();
            renderer.setSize(window.innerWidth, window.innerHeight);

            // ASCII Effect wrapper (Preserves color using { color: true })
            effect = new AsciiEffect(renderer, ' .:-+*=%@#', { invert: true, color: true, resolution: 0.15 });
            effect.setSize(window.innerWidth, window.innerHeight);
            effect.domElement.style.color = 'white';
            effect.domElement.style.backgroundColor = '#050505';

            document.body.appendChild(effect.domElement);

            // Orbit controls for user interaction
            controls = new OrbitControls(camera, effect.domElement);
            controls.enableDamping = true;

            // Load europa.glb
            const loader = new GLTFLoader();
            loader.load('europa.glb', function (gltf) {
                model = gltf.scene;
                
                // Center and scale model automatically
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                
                const maxDim = Math.max(size.x, size.y, size.z);
                model.scale.multiplyScalar(2.0 / maxDim);
                model.position.sub(center);

                scene.add(model);
            }, undefined, function (error) {
                console.error('An error occurred while loading europa.glb:', error);
            });

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            effect.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // Optional subtle idle rotation if desired
            if (model) {
                model.rotation.y += 0.002;
            }

            controls.update();
            effect.render(scene, camera);
        }
    </script>
</body>
</html>
