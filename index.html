<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas UI - ASCII Object</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: monospace;
        }

        /* The content that gets transformed/overlaid by the ASCII effect */
        .ascii-target-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #00ff66;
            text-align: center;
            pointer-events: none;
        }

        h1 {
            font-size: 3.5rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.2rem;
            opacity: 0.8;
        }

        /* Container where the canvas filter/effect mounts */
        #canvas-ui-container {
            position: absolute;
            inset: 0;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- HTML elements that the ASCII shader will process -->
    <div class="ascii-target-content">
        <h1>ASCII Object</h1>
        <p>A shape-matched terminal aesthetic running live via WebGL.</p>
    </div>

    <!-- Target mount point for the canvas -->
    <div id="canvas-ui-container"></div>

    <!-- Script to initialize the ASCII effect -->
    <script type="module">
        // Import the vanilla JS version of the ASCII component from your local directory or registry source
        import { AsciiObject } from './ascii-object-vanilla.js';

        const container = document.getElementById('canvas-ui-container');

        // Initialize the effect
        const asciiEffect = new AsciiObject(container, {
            // Adjust properties like character density or resolution if supported by the component config
            resolution: 0.15,
            charset: ' .:-=+*#%@'
        });
    </script>
</body>
</html>
