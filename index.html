<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>EUROPA PROJECT // LANCER OS</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="europa.css?v=2"/>

  <!-- Three.js and OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  
  <div id="main-interface">
    <!-- Left Column: Terminal & Comms -->
    <div id="left-stack">
      <div id="terminal-wrapper">
        <header>
          <div class="brand">
            <h2>EUROPA PROJECT</h2>
            <small>NHP OMNINET LINK // LANCER SYSTEM</small>
          </div>
          <div id="system-clock">--:--:--</div>
          <button id="tools-toggle">DEPLOY TOOLS</button>
        </header>
        
        <div id="terminal-housing">
          <div id="terminal">
            <div class="line system">Establishing secure Omninet connection...</div>
            <div class="line system">Initializing terminal interface...</div>
          </div>
        </div>
        
        <div class="input-line">
          <span class="prompt">NHP></span>
          <input id="cli" type="text" autocomplete="off" placeholder="INPUT COMMAND..." autofocus />
        </div>
      </div>

      <div id="chat-wrapper">
        <header>
          <h3>PILOT COMMS</h3>
          <span class="status-pulse"></span>
        </header>
        <div id="chat-messages"></div>
        <div class="chat-input-area">
          <span class="prompt">TX></span>
          <input id="chat-input" type="text" placeholder="BROADCAST..." autocomplete="off" />
        </div>
      </div>
    </div>

    <!-- Right Column: Dedicated 3D Europa Viewport -->
    <div id="europa-viewport-wrapper">
      <header>
        <h3>EUROPA TOPOLOGY</h3>
        <small>TECTONIC SECTORS ACTIVE</small>
      </header>
      <div id="europa-3d"></div>
      <div class="viewport-footer">
        <span id="europa-location-text">AWAITING LOCATION DATA...</span>
      </div>
    </div>

  <!-- Sliding Side Tray (Dice & Calc) -->
  <aside id="side-tray">
    <div class="tray-header">
      <h3>SYSTEM TOOLS</h3>
      <button id="tray-close">✖</button>
    </div>

    <div class="tool-section">
      <h4>MECHANICAL RESOLUTION</h4>
      <div id="dice-display">STANDBY</div>
      <div class="dice-grid">
        <button onclick="roll(4)">d4</button>
        <button onclick="roll(6)">d6</button>
        <button onclick="roll(8)">d8</button>
        <button onclick="roll(10)">d10</button>
        <button onclick="roll(12)">d12</button>
        <button onclick="roll(20)">d20</button>
        <button onclick="roll(100)">d100</button>
      </div>
    </div>

    <hr class="divider">

    <div class="tool-section">
      <h4>COMPUTE</h4>
      <div id="calc-screen">0</div>
      <div class="calc-grid">
        <button onclick="calc('7')">7</button>
        <button onclick="calc('8')">8</button>
        <button onclick="calc('9')">9</button>
        <button class="op" onclick="calc('/')">÷</button>
        
        <button onclick="calc('4')">4</button>
        <button onclick="calc('5')">5</button>
        <button onclick="calc('6')">6</button>
        <button class="op" onclick="calc('*')">×</button>
        
        <button onclick="calc('1')">1</button>
        <button onclick="calc('2')">2</button>
        <button onclick="calc('3')">3</button>
        <button class="op" onclick="calc('-')">-</button>
        
        <button class="clear" onclick="calc('C')">C</button>
        <button onclick="calc('0')">0</button>
        <button class="equal" onclick="calc('=')">=</button>
        <button class="op" onclick="calc('+')">+</button>
      </div>
    </div>
  </aside>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  
  <script src="europa.js?v=4"></script>
</body>
</html>
