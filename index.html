<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII Object Viewer</title>
  <style>
    /* Basic reset and terminal aesthetic */
    body { 
        margin: 0; 
        overflow: hidden; 
        background-color: black; 
        color: #00ff00; 
        font-family: monospace; 
    }
    #overlay { 
        position: absolute; 
        top: 20px; 
        width: 100%; 
        text-align: center; 
        pointer-events: none; /* Lets you click through the text to rotate the 3D model */
        z-index: 10; 
    }
    h1 { 
        margin: 0; 
        text-transform: uppercase; 
        letter-spacing: 4px; 
    }
  </style>

  <!-- This Import Map replaces 'npm install'. It grabs the Three.js files from the web -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- Your UI Overlay -->
  <div id="overlay">
    <h1>ASCII Object</h1>
    <p>Drag to rotate the 3D model</p>
  </div>

  <!-- The 3D Logic -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { AsciiEffect } from 'three/addons/effects/AsciiEffect.js';

    // 1. Setup Scene and Camera
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    // 2. Setup the Renderer and the ASCII Filter
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    
    // You can change the characters here to change the "density" of the shading
    const effect = new AsciiEffect(renderer, ' .:-+*=%@#', { invert: true });
    effect.setSize(window.innerWidth, window.innerHeight);
    effect.domElement.style.color = '#00ff00';
    effect.domElement.style.backgroundColor = 'black';
    document.body.appendChild(effect.domElement);

    // 3. Add Lighting so the model has shadows and highlights
    const light = new THREE.PointLight(0xffffff, 200);
    light.position.set(5, 5, 5);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0x404040));

    // 4. Load your .glb model from GitHub
    const loader = new GLTFLoader();
    
    // IMPORTANT: Change 'my-model.glb' to the exact name of the file you uploaded!
    loader.load('my-model.glb', function (gltf) {
        
        // Force a sleek, glossy finish on the model materials
        gltf.scene.traverse((child) => {
            if (child.isMesh && child.material) {
                child.material.roughness = 0.1;
                child.material.metalness = 0.8;
            }
        });
        
        // Center the model
        gltf.scene.position.set(0, 0, 0);
        scene.add(gltf.scene);
        
    }, undefined, function (error) {
        console.error('Error loading model. Make sure the filename is correct!', error);
        
        // Fallback: A spinning cube if the model fails to load or the name is wrong
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshStandardMaterial({ color: 0x00ff00, roughness: 0.1 });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);
    });

    // 5. Add Mouse Controls
    const controls = new OrbitControls(camera, effect.domElement);
    controls.enableDamping = true;
    
    // 6. Animation Loop
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        effect.render(scene, camera);
    }
    animate();

    // 7. Make it responsive when resizing the browser window
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        effect.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
