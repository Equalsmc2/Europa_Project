<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>CRYO ARCHIVE // OMNINET</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="europa.css?v=24"/>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <!-- Full Screen 3D Viewport -->
  <div id="europa-3d"></div>

  <!-- High-Gloss Liquid Glass HUD -->
  <div id="hud-interface">
    
    <!-- LEFT PANEL: Terminal -->
    <div id="left-stack" class="liquid-glass">
      <div id="terminal-wrapper">
        <header>
          <div class="brand">
            <h2>CRYO ARCHIVE</h2>
            <small>OMNINET LINK // <span id="europa-location-text">LOC_TRACK: OFFLINE</span></small>
          </div>
          <div id="system-clock">--:--:--</div>
        </header>
        
        <div id="terminal-housing">
          <div id="terminal">
            <div class="line system">Establishing secure Omninet connection...</div>
          </div>
        </div>
        
        <div class="input-line">
          <span class="prompt">NHP></span>
          <input id="cli" type="text" autocomplete="off" placeholder="AWAITING INPUT..." autofocus />
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL: Local Comms -->
    <div id="right-stack" class="liquid-glass">
      <div id="chat-wrapper">
        <header>
          <h3>LOCAL COMMS</h3>
          <span class="status-pulse"></span>
        </header>
        
        <div id="chat-housing">
          <div id="chat-messages"></div>
        </div>
        
        <div class="chat-input-area">
          <span class="prompt">TX></span>
          <input id="chat-input" type="text" placeholder="BROADCAST..." autocomplete="off" />
        </div>
      </div>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
  
  <script src="europa.js?v=24"></script>
</body>
</html>
