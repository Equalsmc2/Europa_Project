<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASCII Object Viewer</title>
  <style>
    body { 
        margin: 0; 
        overflow: hidden; 
        background-color: #ffffff; 
        font-family: 'Courier New', Courier, monospace; 
    }
    
    /* Translucent, curved overlay */
    #overlay { 
        position: absolute; 
        bottom: 40px; 
        left: 50%;
        transform: translateX(-50%);
        background: rgba(255, 255, 255, 0.6); 
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 15px 40px;
        border-radius: 30px; 
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.8);
        text-align: center; 
        pointer-events: none; 
        z-index: 10; 
        color: #1e293b;
    }

    h1 { 
        margin: 0; 
        font-size: 1.5rem;
        text-transform: uppercase; 
        letter-spacing: 2px; 
    }
    
    p {
        margin: 5px 0 0 0;
        font-size: 0.9rem;
        opacity: 0.7;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div id="overlay">
    <h1>Europa</h1>
    <p>Drag to rotate</p>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { AsciiEffect } from 'three/addons/effects/AsciiEffect.js';

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    
    // Configured for a light theme
    const effect = new AsciiEffect(renderer, ' .:-+*=%@#', { invert: false });
    effect.setSize(window.innerWidth, window.innerHeight);
    effect.domElement.style.color = '#0f172a'; // Sleek dark slate characters
    effect.domElement.style.backgroundColor = '#ffffff'; // White background
    document.body.appendChild(effect.domElement);

    // Bright lighting for high-gloss reflections
    const mainLight = new THREE.PointLight(0xffffff, 300);
    mainLight.position.set(5, 5, 5);
    scene.add(mainLight);
    
    const fillLight = new THREE.PointLight(0xffffff, 150);
    fillLight.position.set(-5, -5, -5);
    scene.add(fillLight);
    
    scene.add(new THREE.AmbientLight(0xffffff, 1.5));

    const loader = new GLTFLoader();
    
    // Loading europa.glb
    loader.load('europa.glb', function (gltf) {
        
        // Applying a high-gloss finish to all materials
        gltf.scene.traverse((child) => {
            if (child.isMesh && child.material) {
                child.material.roughness = 0.05; 
                child.material.metalness = 0.9;
                
                // If it's a standard material, we can make it extra shiny
                if (child.material.isMeshStandardMaterial) {
                    child.material.envMapIntensity = 2.0;
                }
            }
        });
        
        gltf.scene.position.set(0, 0, 0);
        scene.add(gltf.scene);
        
    }, undefined, function (error) {
        console.error('Error loading model.', error);
        
        // Fallback cube with matching gloss
        const geometry = new THREE.BoxGeometry(2, 2, 2);
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x94a3b8, 
            roughness: 0.05,
            metalness: 0.9
        });
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);
    });

    const controls = new OrbitControls(camera, effect.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        effect.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        effect.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
